# Step 1 monolith: Spring Boot + MySQL + Flyway + jOOQ.
server:
  address: 127.0.0.1
  port: 8070
spring:
  application:
    name: ecomm-monolith
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:13306/skillup?serverTimezone=UTC&useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:skillup}
    password: ${DB_PASSWORD:skillup_local}
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
promotion:
  stock-strategy: ${STOCK_STRATEGY:optimistic}
order:
  dataCenter: 1
  machineNum: 1
