name: ecomm-step1
services:
  mysql:
    image: mysql:8.0
    ports:
      - "127.0.0.1:13306:3306"
    environment:
      MYSQL_DATABASE: skillup
      MYSQL_USER: skillup
      MYSQL_PASSWORD: skillup_local
      MYSQL_ROOT_PASSWORD: step1_root_local
      TZ: UTC
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  mysql-data:
